<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Desafío Pirata vs. Ninja | M&C Estampados - TUNJOGEEK</title>
  <style>
    :root {
      --bg: #0b0e17;
      --card: #151b2b;
      --border: #28334d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --pirate: #ef4444;
      --pirate-glow: rgba(239, 68, 68, 0.35);
      --ninja: #f97316;
      --ninja-glow: rgba(249, 115, 22, 0.35);
      --accent: #38bdf8;
      --gold: #facc15;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #172038 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      position: relative;
    }

    /* Header */
    .brand-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: rgba(21, 27, 43, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .event-subtitle {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold);
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Global Battle Bar */
    .war-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }

    .war-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .war-bar {
      height: 12px;
      border-radius: 999px;
      background: #1e293b;
      overflow: hidden;
      display: flex;
    }

    .war-pirate {
      background: linear-gradient(90deg, #dc2626, #f87171);
      transition: width 0.5s ease;
    }

    .war-ninja {
      background: linear-gradient(90deg, #fb923c, #ea580c);
      transition: width 0.5s ease;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 4px 0;
    }

    .hero h1 {
      font-size: 1.45rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .hero p {
      font-size: 0.86rem;
      color: var(--muted);
    }

    /* Faction selector */
    .factions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .faction-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px 10px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .faction-btn .icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 4px;
    }

    .faction-btn .name {
      font-weight: 800;
      font-size: 0.95rem;
      display: block;
    }

    .faction-btn .sub {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .faction-btn.selected[data-faction="pirate"] {
      border-color: var(--pirate);
      box-shadow: 0 0 18px var(--pirate-glow);
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.16), var(--card));
    }

    .faction-btn.selected[data-faction="ninja"] {
      border-color: var(--ninja);
      box-shadow: 0 0 18px var(--ninja-glow);
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.16), var(--card));
    }

    /* Inputs */
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      background: #0d121f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent);
    }

    /* Scoring Legend */
    .legend-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
    }

    .legend-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }

    .legend-item {
      background: #0d121f;
      border: 1px solid #1f2940;
      border-radius: 10px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .legend-item svg {
      width: 28px;
      height: 28px;
      margin-bottom: 3px;
    }

    .legend-item span {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.1;
    }

    .legend-item strong {
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .combo-note {
      font-size: 0.72rem;
      color: var(--accent);
      text-align: center;
      margin-top: 7px;
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-pirate {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 8px 20px var(--pirate-glow);
    }

    .btn-ninja {
      background: linear-gradient(135deg, #f97316, #c2410c);
      color: #fff;
      box-shadow: 0 8px 20px var(--ninja-glow);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px;
      font-size: 0.88rem;
    }

    /* Game Screen */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
    }

    .hud-box {
      text-align: center;
    }

    .hud-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .hud-val {
      font-size: 1.25rem;
      font-weight: 900;
    }

    .combo-badge {
      background: rgba(250, 204, 21, 0.16);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #070a12;
      touch-action: none;
      min-height: 380px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .touch-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--muted);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Result Screen */
    .result-banner {
      background: var(--card);
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.15);
    }

    .rank-tag {
      display: inline-block;
      background: rgba(250, 204, 21, 0.15);
      color: var(--gold);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .final-score {
      font-size: 2.3rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .coupon-box {
      margin-top: 10px;
      background: #0b0f1c;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 10px;
    }

    .coupon-code {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .coupon-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Checklist Funnel */
    .mission-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .mission-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--gold);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0e1424;
      border: 1px solid var(--border
